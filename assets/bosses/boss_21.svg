<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Golden Armor Gradient -->
    <linearGradient id="goldArmorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Celestial Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Runeblade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Zone Pattern & Vignette Ring -->
  <circle cx="200" cy="180" r="170" fill="none" stroke="#e11d48" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="180" r="150" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.25"/>

  <!-- Wings / Aura / Background FX -->
  <g id="auraWings" filter="url(#shadow)">
    
      <path d="M 200,160 Q 120,80 60,110 Q 90,170 120,180 Q 70,200 90,240 Q 150,210 200,200 Z" fill="#1e1035" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
      <path d="M 200,160 Q 280,80 340,110 Q 310,170 280,180 Q 330,200 310,240 Q 250,210 200,200 Z" fill="#1e1035" stroke="#e11d48" stroke-width="2" opacity="0.85"/>
      <circle cx="200" cy="175" r="130" fill="none" stroke="#e11d48" stroke-width="2.5" stroke-dasharray="16 6" opacity="0.5"/>
      <ellipse cx="200" cy="185" rx="115" ry="120" fill="#e11d48" opacity="0.16" filter="url(#glow)"/>
    
  </g>

  <!-- Character Group Scaled and Centered -->
  <g id="character" transform="translate(16.39999999999999, 14.759999999999993) scale(0.918)" filter="url(#shadow)">
    <!-- Horns / Crests -->
    <g id="horns">
      
      <polygon points="175,130 160,85 185,115" fill="#1e293b" stroke="#e11d48" stroke-width="2"/>
      <polygon points="225,130 240,85 215,115" fill="#1e293b" stroke="#e11d48" stroke-width="2"/>
    
    </g>

    <!-- Torso & Armor -->
    <g id="torso">
      
      <!-- Zone 3 Dark Reaper Carapace -->
      <polygon points="140,195 200,185 260,195 270,305 200,325 130,305" fill="#090414" stroke="#e11d48" stroke-width="3"/>
      <!-- Glowing core -->
      <polygon points="200,215 215,235 200,255 185,235" fill="#fb7185" filter="url(#glow)"/>
      <line x1="200" y1="255" x2="200" y2="310" stroke="#e11d48" stroke-width="2"/>
    
    </g>

    <!-- Head & Mask -->
    <g id="head">
      
      <!-- Zone 3 Terrifying Skull Reaper Face -->
      <path d="M 168,135 Q 200,115 232,135 Q 235,170 220,188 L 210,198 L 190,198 L 180,188 Q 165,170 168,135 Z" fill="#0a0518" stroke="#e11d48" stroke-width="3"/>
      <!-- Sharp fangs / grimace -->
      <polygon points="188,185 192,193 196,185 200,193 204,185 208,193 212,185" fill="#e11d48"/>
    
    </g>

    <!-- Glowing Eyes -->
    <g id="eyes">
      
      <polygon points="178,145 198,154 182,160" fill="#fb7185" filter="url(#glow)"/>
      <circle cx="188" cy="153" r="3" fill="#ffffff" filter="url(#glow)"/>
      <polygon points="222,145 202,154 218,160" fill="#fb7185" filter="url(#glow)"/>
      <circle cx="212" cy="153" r="3" fill="#ffffff" filter="url(#glow)"/>
    
    </g>

    <!-- Weapon / Relic -->
    <g id="weapon">
      
      <!-- Death Scythe -->
      <line x1="260" y1="90" x2="290" y2="320" stroke="#475569" stroke-width="4"/>
      <path d="M 260,90 Q 340,60 350,130 Q 310,110 260,115 Z" fill="#e11d48" stroke="#fb7185" stroke-width="2" filter="url(#glow)"/>
    
    </g>
  </g>

  <!-- Stage Badge & Tier Banner Overlay -->
  <g id="stageBadge" transform="translate(16, 16)">
    <rect width="90" height="26" rx="13" fill="#090d16" stroke="#e11d48" stroke-width="1.5"/>
    <text x="45" y="18" fill="#fb7185" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">
      STAGE 21
    </text>
  </g>

  <g id="zoneBadge" transform="translate(290, 16)">
    <rect width="94" height="26" rx="6" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="337" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      Zone 3 
    </text>
  </g>

  <!-- Bottom Name Banner -->
  <g id="nameBanner" transform="translate(0, 340)">
    <rect width="400" height="60" fill="#090d16" opacity="0.88"/>
    <line x1="0" y1="0" x2="400" y2="0" stroke="#e11d48" stroke-width="2" opacity="0.6"/>
    <text x="200" y="26" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">
      내신 참사의 망령, 미드텀
    </text>
    <text x="200" y="46" fill="#fb7185" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" opacity="0.9">
      Midterm Despair
    </text>
  </g>
</svg>