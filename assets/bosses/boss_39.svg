<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Golden Armor Gradient -->
    <linearGradient id="goldArmorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Celestial Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Runeblade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Zone Pattern & Vignette Ring -->
  <circle cx="200" cy="180" r="170" fill="none" stroke="#f43f5e" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="180" r="150" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.25"/>

  <!-- Wings / Aura / Background FX -->
  <g id="auraWings" filter="url(#shadow)">
    
      <path d="M 200,150 L 80,70 L 110,130 L 50,150 L 120,180 L 70,220 L 180,210 Z" fill="#0c2340" stroke="#f43f5e" stroke-width="2" opacity="0.9"/>
      <path d="M 200,150 L 320,70 L 290,130 L 350,150 L 280,180 L 330,220 L 220,210 Z" fill="#0c2340" stroke="#f43f5e" stroke-width="2" opacity="0.9"/>
      <polygon points="200,30 215,80 200,75 185,80" fill="#38bdf8" opacity="0.75"/>
      <circle cx="200" cy="175" r="140" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="20 8" opacity="0.6"/>
      <ellipse cx="200" cy="180" rx="125" ry="125" fill="#f43f5e" opacity="0.20" filter="url(#glow)"/>
    
  </g>

  <!-- Character Group Scaled and Centered -->
  <g id="character" transform="translate(-12.400000000000011, -11.16000000000001) scale(1.062)" filter="url(#shadow)">
    <!-- Horns / Crests -->
    <g id="horns">
      
      <polygon points="175,130 160,85 185,115" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
      <polygon points="225,130 240,85 215,115" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    
    </g>

    <!-- Torso & Armor -->
    <g id="torso">
      
      <!-- Zone 4 Glacial Skeletal Plate -->
      <polygon points="135,190 200,180 265,190 275,310 200,330 125,310" fill="#0a192f" stroke="#f43f5e" stroke-width="4"/>
      <!-- Bone ribs -->
      <path d="M 150,215 Q 200,230 250,215" fill="none" stroke="#f8fafc" stroke-width="3"/>
      <path d="M 155,240 Q 200,255 245,240" fill="none" stroke="#f8fafc" stroke-width="3"/>
      <path d="M 165,265 Q 200,278 235,265" fill="none" stroke="#f8fafc" stroke-width="2.5"/>
      <circle cx="200" cy="245" r="12" fill="#38bdf8" filter="url(#glow)"/>
    
    </g>

    <!-- Head & Mask -->
    <g id="head">
      
      <!-- Zone 4 Glacial Skull King / Bone Inquisitor Face -->
      <polygon points="165,130 200,110 235,130 230,175 212,198 188,198 170,175" fill="#09182a" stroke="#f43f5e" stroke-width="4"/>
      <!-- Bone nasal cavity -->
      <polygon points="200,165 196,174 204,174" fill="#f43f5e"/>
      <!-- Freezing teeth -->
      <line x1="182" y1="184" x2="218" y2="184" stroke="#f43f5e" stroke-width="2"/>
      <line x1="188" y1="180" x2="188" y2="188" stroke="#f43f5e" stroke-width="1.5"/>
      <line x1="200" y1="180" x2="200" y2="188" stroke="#f43f5e" stroke-width="1.5"/>
      <line x1="212" y1="180" x2="212" y2="188" stroke="#f43f5e" stroke-width="1.5"/>
    
    </g>

    <!-- Glowing Eyes -->
    <g id="eyes">
      
      <polygon points="180,146 196,146 192,156 182,156" fill="#fda4af" filter="url(#glow)"/>
      <circle cx="188" cy="151" r="2.5" fill="#ffffff"/>
      <polygon points="220,146 204,146 208,156 218,156" fill="#fda4af" filter="url(#glow)"/>
      <circle cx="212" cy="151" r="2.5" fill="#ffffff"/>
    
    </g>

    <!-- Weapon / Relic -->
    <g id="weapon">
      
    </g>
  </g>

  <!-- Stage Badge & Tier Banner Overlay -->
  <g id="stageBadge" transform="translate(16, 16)">
    <rect width="90" height="26" rx="13" fill="#090d16" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="45" y="18" fill="#fda4af" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">
      STAGE 39
    </text>
  </g>

  <g id="zoneBadge" transform="translate(290, 16)">
    <rect width="94" height="26" rx="6" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="337" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      Zone 4 
    </text>
  </g>

  <!-- Bottom Name Banner -->
  <g id="nameBanner" transform="translate(0, 340)">
    <rect width="400" height="60" fill="#090d16" opacity="0.88"/>
    <line x1="0" y1="0" x2="400" y2="0" stroke="#f43f5e" stroke-width="2" opacity="0.6"/>
    <text x="200" y="26" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">
      한계 조롱의 악귀, 모커리
    </text>
    <text x="200" y="46" fill="#fda4af" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" opacity="0.9">
      Mockery Demon
    </text>
  </g>
</svg>