<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3f1dcb"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>

    <!-- Golden Armor Gradient -->
    <linearGradient id="goldArmorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <!-- Celestial Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#451a03" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Runeblade Gradient -->
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" fill="url(#bgGrad)"/>

  <!-- Zone Pattern & Vignette Ring -->
  <circle cx="200" cy="180" r="170" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="180" r="150" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.25"/>

  <!-- Wings / Aura / Background FX -->
  <g id="auraWings" filter="url(#shadow)">
    
      <polygon points="200,40 230,120 210,130 190,130 170,120" fill="#334155" stroke="#8b5cf6" stroke-width="2"/>
      <polygon points="110,90 140,150 120,160 100,140" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <polygon points="290,90 300,140 280,160 260,150" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <circle cx="200" cy="180" r="120" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="12 8" opacity="0.45"/>
      <ellipse cx="200" cy="190" rx="100" ry="110" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>
    
  </g>

  <!-- Character Group Scaled and Centered -->
  <g id="character" transform="translate(26, 23.400000000000002) scale(0.87)" filter="url(#shadow)">
    <!-- Horns / Crests -->
    <g id="horns">
      
      <polygon points="175,130 160,85 185,115" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
      <polygon points="225,130 240,85 215,115" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    
    </g>

    <!-- Torso & Armor -->
    <g id="torso">
      
      <!-- Zone 2 Heavy Spiked Breastplate -->
      <polygon points="145,195 200,190 255,195 265,295 200,315 135,295" fill="#1c1917" stroke="#8b5cf6" stroke-width="2.5"/>
      <!-- Rib plating -->
      <path d="M 160,225 L 200,235 L 240,225" fill="none" stroke="#8b5cf6" stroke-width="2.5"/>
      <path d="M 165,250 L 200,260 L 235,250" fill="none" stroke="#8b5cf6" stroke-width="2"/>
      <path d="M 175,275 L 200,282 L 225,275" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    
    </g>

    <!-- Head & Mask -->
    <g id="head">
      
      <!-- Zone 2 Heavy Stone / Iron Mask Head -->
      <polygon points="170,135 200,120 230,135 225,180 200,195 175,180" fill="#0f172a" stroke="#8b5cf6" stroke-width="2.5"/>
      <!-- Jaw slits -->
      <line x1="185" y1="180" x2="215" y2="180" stroke="#8b5cf6" stroke-width="2"/>
      <line x1="190" y1="186" x2="210" y2="186" stroke="#8b5cf6" stroke-width="1.5"/>
    
    </g>

    <!-- Glowing Eyes -->
    <g id="eyes">
      
      <polygon points="180,150 196,155 184,158" fill="#ef4444" filter="url(#glow)"/>
      <polygon points="220,150 204,155 216,158" fill="#ef4444" filter="url(#glow)"/>
    
    </g>

    <!-- Weapon / Relic -->
    <g id="weapon">
      
    </g>
  </g>

  <!-- Stage Badge & Tier Banner Overlay -->
  <g id="stageBadge" transform="translate(16, 16)">
    <rect width="90" height="26" rx="13" fill="#090d16" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="45" y="18" fill="#ef4444" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">
      STAGE 15
    </text>
  </g>

  <g id="zoneBadge" transform="translate(290, 16)">
    <rect width="94" height="26" rx="6" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="337" y="17" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">
      Zone 2 
    </text>
  </g>

  <!-- Bottom Name Banner -->
  <g id="nameBanner" transform="translate(0, 340)">
    <rect width="400" height="60" fill="#090d16" opacity="0.88"/>
    <line x1="0" y1="0" x2="400" y2="0" stroke="#8b5cf6" stroke-width="2" opacity="0.6"/>
    <text x="200" y="26" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle">
      수면 부족의 악령, 인섬니아
    </text>
    <text x="200" y="46" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle" opacity="0.9">
      Insomnia Fiend
    </text>
  </g>
</svg>