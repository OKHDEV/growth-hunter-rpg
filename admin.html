  <script>
    (function() {
      try {
        const isAuth = (typeof localStorage !== 'undefined') &&
                       (localStorage.getItem('isAdminLoggedIn') === 'true') &&
                       (localStorage.getItem('awakened_hunter_cloud_session_v1')?.toLowerCase().includes('"userid":"admin"'));
        if (!isAuth) {
          window.location.replace('index.html');
        }
      } catch (e) {
        window.location.replace('index.html');
      }
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=20261029_36">
  <style>
    :root {
      --admin-gold: #facc15;
      --admin-cyan: #00e5ff;
      --admin-emerald: #10b981;
      --admin-rose: #f43f5e;
      --admin-purple: #a855f7;

    body {
      background: #070a13;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      padding: 16px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;

    }

    /* Header */
    .admin-header {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.98), rgba(30, 41, 59, 0.95));
      border: 1px solid rgba(0, 229, 255, 0.35);
      border-radius: 16px;
      padding: 20px 24px;

    }
    .admin-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 14px;
      margin-bottom: 12px;
    }
    .admin-header h1 {
      margin: 0;
      color: #00e5ff;
      font-size: 1.55rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.5px;
    }
    .btn-return-game {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      color: #ffffff !important;
      border: 1px solid #34d399 !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.45);
      padding: 10px 18px !important;

    .btn-return-game:hover {

    /* KPI Metrics Bar */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .kpi-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    .kpi-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--admin-cyan);
    }
    .kpi-card.gold::before { background: var(--admin-gold); }
    .kpi-card.emerald::before { background: var(--admin-emerald); }
    .kpi-card.rose::before { background: var(--admin-rose); }
    .kpi-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .kpi-value {
      font-size: 1.45rem;
      font-weight: 900;

    }

    /* Global Tools Bar */
    .toolbar-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 20px;
      display: flex;

    .search-input {

    .select-dropdown {

      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: #fff;
      font-size: 0.85rem;

    }

    /* User Account Cards */
    .account-card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;

    }
    .account-card:hover {
      border-color: rgba(0, 229, 255, 0.45);

    .account-header {

    /* Sub Tabs in User Card */
    .user-subtabs {

    /* Action Grid */
    .action-panel-grid {

    .cheat-boss:hover { background: #ef4444; color: #fff; }
    .cheat-quest { background: rgba(52, 211, 153, 0.18); border-color: #34d399; color: #34d399; }
    .cheat-quest:hover { background: #34d399; color: #000; }
    .cheat-omega { background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(245, 158, 11, 0.25)); border-color: #c084fc; color: #facc15; }
    .cheat-omega:hover { background: #c084fc; color: #000; }

    /* JSON Editor */
    .json-editor {
      width: 100%;
      height: 300px;
      background: #040711;
      border: 1px solid rgba(0, 229, 255, 0.25);
      border-radius: 8px;
      color: #38bdf8;
      font-family: Consolas, monospace;
      font-size: 0.85rem;
      padding: 12px;
      box-sizing: border-box;
      resize: vertical;
    }

    /* Buttons */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn-action {
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-cyan { background: rgba(0, 229, 255, 0.18); border-color: #00e5ff; color: #00e5ff; }
    .btn-cyan:hover { background: #00e5ff; color: #000; }
    .btn-emerald { background: rgba(16, 185, 129, 0.18); border-color: #10b981; color: #34d399; }
    .btn-emerald:hover { background: #10b981; color: #000; }
    .btn-amber { background: rgba(245, 158, 11, 0.18); border-color: #f59e0b; color: #fbbf24; }
    .btn-amber:hover { background: #f59e0b; color: #000; }
    .btn-rose { background: rgba(244, 63, 94, 0.18); border-color: #f43f5e; color: #fda4af; }
    .btn-rose:hover { background: #f43f5e; color: #fff; }

    /* Sticky Floating Return Button */
    .floating-back-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 999;
      background: linear-gradient(135deg, #10b981, #059669);

      padding: 12px 22px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6), 0 0 18px rgba(16, 185, 129, 0.65);
      border: 2px solid #a7f3d0;
      display: inline-flex;
      align-items: center;

    .floating-back-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.85);

<body>

  <!-- 🗄️ Main Admin Panel Content -->
  <div class="admin-container" id="adminMainContent">
    
    <!-- Header -->
    <div class="admin-header">
      <div class="admin-header-top">
        <h1>👑 슈퍼 관리자(Admin) 통합 관제 콘솔</h1>
        <a href="index.html" class="btn-return-game">
          🎮 메인 게임으로 돌아가기 ↗
        </a>
      </div>

      <p style="margin: 0 0 16px 0; color: #94a3b8; font-size: 0.9rem; line-height: 1.5;">
        가입 유저 실시간 통계, 골드·레벨·스탯 원클릭 조작, 보스/퀘스트/칭호 해금 및 클라우드 즉시 동기화
      </p>

      <div class="btn-group" style="gap: 10px;">
        <a href="index.html" class="btn-action btn-emerald" style="text-decoration:none;">
          🎮 메인 게임으로 돌아가기
        </a>
        <button class="btn-action btn-amber" onclick="loadAllAccounts()">
          🔄 실시간 새로고침
        </button>
        <button class="btn-action btn-cyan" onclick="exportAllDatabaseJson()">
          📥 전체 서버 DB 백업 (JSON 다운로드)
        </button>
        <button class="btn-action btn-rose" onclick="logoutAdmin()" style="margin-left: auto;">
          🚪 관리자 로그아웃
        </button>
      </div>
    </div>

    <!-- 📊 KPI Metrics Grid -->
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">총 가입 유저 수</div>
        <div class="kpi-value" id="kpiTotalUsers" style="color:#38bdf8;">-</div>
      </div>
      <div class="kpi-card gold">
        <div class="kpi-label">서버 유통 총 골드</div>
        <div class="kpi-value" id="kpiTotalGold" style="color:#facc15;">-</div>
      </div>
      <div class="kpi-card emerald">
        <div class="kpi-label">최고 레벨 / 평균 레벨</div>
        <div class="kpi-value" id="kpiLevelInfo" style="color:#34d399;">-</div>
      </div>
      <div class="kpi-card rose">
        <div class="kpi-label">최고 보스 돌파 단계</div>
        <div class="kpi-value" id="kpiMaxStage" style="color:#f87171;">-</div>
      </div>
    </div>

    <!-- 🔍 Search & Filter Toolbar -->
    <div class="toolbar-box">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <input type="text" id="userSearchInput" class="search-input" placeholder="🔍 유저 ID 검색..." oninput="filterAccountsList()">
        <select id="userSortSelect" class="select-dropdown" onchange="filterAccountsList()">
          <option value="recent">최근 동기화 순</option>
          <option value="level">레벨 높은 순</option>
          <option value="gold">골드 많은 순</option>
          <option value="stage">보스 단계 높은 순</option>
          <option value="id">아이디 이름 순</option>
        </select>
      </div>
      <div style="font-size:0.85rem; color:#94a3b8;">
        조회된 유저: <strong id="displayedUserCount" style="color:#00e5ff;">0</strong>명
      </div>
    </div>

    <!-- 📋 Accounts List Container -->
    <div id="accountsList">
      <div class="loading-spinner">📡 서버에서 유저 계정 목록을 불러오는 중...</div>
    </div>
  </div>

  <!-- 🎮 Floating Sticky "메인 게임으로 돌아가기" Button -->
  <a href="index.html" class="floating-back-btn" title="메인 게임 플레이 화면으로 이동">
    🎮 메인 게임으로 돌아가기
  </a>

  <script>
    const NTFY_BASE = 'https://ntfy.sh/okh_gh_cloud_v4_';
    const BYTEBIN_URL = 'https://bytebin.lucko.me';
    const PASTES_URL = 'https://api.pastes.dev';

    let rawAccountsRegistry = {};
    let cachedUserSaves = {}; // userId -> saveJson

    function checkAdminAuth() {
      const isAuth = (typeof localStorage !== 'undefined') &&
                     (localStorage.getItem('isAdminLoggedIn') === 'true') &&
                     (localStorage.getItem('awakened_hunter_cloud_session_v1')?.toLowerCase().includes('"userid":"admin"'));

      if (!isAuth) {
        window.location.replace('index.html');
        return;
      }

      loadAllAccounts();
    }

    function logoutAdmin() {
      if (confirm('관리자 세션을 로그아웃하고 메인 게임 화면으로 이동하시겠습니까?')) {
        try {
          localStorage.removeItem('isAdminLoggedIn');
          sessionStorage.removeItem('isAdminLoggedIn');
          localStorage.removeItem('awakened_hunter_cloud_session_v1');
        } catch (e) {}
        window.location.replace('index.html');
      }
    }

    function userIdToHex(userId) {
      const clean = String(userId || '').trim().toLowerCase();
      let hex = '';
      for (let i = 0; i < clean.length; i++) {
        hex += clean.charCodeAt(i).toString(16);
      }
      return hex.slice(0, 32) || 'default';
    }

    function formatGold(num) {
      const n = Number(num) || 0;
      if (n >= 1000000000000) return (n / 1000000000000).toFixed(1) + '조';
      if (n >= 100000000) return (n / 100000000).toFixed(1) + '억';
      if (n >= 10000) return (n / 10000).toFixed(1) + '만';
      return n.toLocaleString();
    }

    async function loadAllAccounts() {
      const listEl = document.getElementById('accountsList');
      listEl.innerHTML = '<div class="loading-spinner">📡 서버에서 유저 계정 목록을 불러오는 중...</div>';

      try {
        const res = await fetch(`${NTFY_BASE}registry/json?poll=1&since=0`);
        if (!res.ok) throw new Error('서버 응답 실패: ' + res.status);

        const text = (await res.text()).trim();
        let registry = {};

        if (text) {
          const lines = text.split('\n');
          for (const line of lines) {
            try {
              const msg = JSON.parse(line);
              if (msg && msg.message) {
                const parsed = JSON.parse(msg.message);
                registry = { ...registry, ...parsed };
              }
            } catch (e) {}
          }
        }

        rawAccountsRegistry = registry;
        filterAccountsList();

        // Background preload saves for KPI calculation
        calculateKpiStats();

      } catch (err) {
        listEl.innerHTML = `<div style="text-align:center; padding:40px; color:#ef4444;">계정 목록 로드 실패: ${err.message}</div>`;
      }
    }

    async function calculateKpiStats() {
      const userIds = Object.keys(rawAccountsRegistry);
      document.getElementById('kpiTotalUsers').textContent = `${userIds.length}명`;

      let totalGold = 0;
      let maxLv = 1;
      let lvSum = 0;
      let lvCount = 0;
      let maxStage = 1;

      for (const uid of userIds) {
        const accInfo = rawAccountsRegistry[uid] || {};
        if (accInfo.deleted) continue;

        let save = cachedUserSaves[uid] || null;
        if (!save && accInfo.bk) {
          try {
            const r = await fetch(`${BYTEBIN_URL}/${accInfo.bk}`);
            if (r.ok) {
              save = await r.json();
              cachedUserSaves[uid] = save;
            }
          } catch(e) {}
        }

        if (save && save.player) {
          const g = Number(save.player.gold) || 0;
          const lv = Number(save.player.level) || 1;
          const st = Number((save.raid && save.raid.unlockedStage) || 1);
          totalGold += g;
          if (lv > maxLv) maxLv = lv;
          if (st > maxStage) maxStage = st;
          lvSum += lv;
          lvCount++;
        }
      }

      document.getElementById('kpiTotalGold').textContent = `${formatGold(totalGold)} G`;
      const avgLv = lvCount > 0 ? (lvSum / lvCount).toFixed(1) : 1;
      document.getElementById('kpiLevelInfo').textContent = `Lv.${maxLv} (평균 Lv.${avgLv})`;
      document.getElementById('kpiMaxStage').textContent = `STAGE ${maxStage}`;
    }

    function filterAccountsList() {
      const listEl = document.getElementById('accountsList');
      const query = (document.getElementById('userSearchInput').value || '').trim().toLowerCase();
      const sortBy = document.getElementById('userSortSelect').value;

      let userIds = Object.keys(rawAccountsRegistry).filter(uid => {
        const acc = rawAccountsRegistry[uid];
        if (acc && acc.deleted) return false;
        if (!query) return true;
        return uid.toLowerCase().includes(query);
      });

      // Sorting
      userIds.sort((a, b) => {
        const accA = rawAccountsRegistry[a] || {};
        const accB = rawAccountsRegistry[b] || {};
        const saveA = cachedUserSaves[a] || {};
        const saveB = cachedUserSaves[b] || {};

        if (sortBy === 'level') {
          return ((saveB.player && saveB.player.level) || 1) - ((saveA.player && saveA.player.level) || 1);
        }
        if (sortBy === 'gold') {
          return ((saveB.player && saveB.player.gold) || 0) - ((saveA.player && saveA.player.gold) || 0);
        }
        if (sortBy === 'stage') {
          return ((saveB.raid && saveB.raid.unlockedStage) || 1) - ((saveA.raid && saveA.raid.unlockedStage) || 1);
        }
        if (sortBy === 'id') {
          return a.localeCompare(b);
        }
        return (accB.ts || 0) - (accA.ts || 0); // default: recent
      });

      document.getElementById('displayedUserCount').textContent = userIds.length;

      if (userIds.length === 0) {
        listEl.innerHTML = '<div style="text-align:center; padding:50px; color:#64748b; font-size:1.05rem;">검색 조건에 맞는 유저 계정이 없습니다.</div>';
        return;
      }

      listEl.innerHTML = '';
      for (const uid of userIds) {
        const accInfo = rawAccountsRegistry[uid] || {};
        const card = document.createElement('div');
        card.className = 'account-card';
        card.id = `card_${userIdToHex(uid)}`;

        const hexId = userIdToHex(uid);
        const syncDateStr = accInfo.ts ? new Date(accInfo.ts).toLocaleString() : '기록 없음';

        card.innerHTML = `
          <div class="account-header">
            <div>
              <span class="user-badge">👤 ${uid}</span>
              <span class="pw-badge">비밀번호: <strong>${accInfo.p || '미설정'}</strong></span>
              <span style="font-size:0.8rem; color:#64748b; margin-left:8px;">최근 동기화: ${syncDateStr}</span>
            </div>
            <div class="btn-group">
              <button class="btn-action btn-cyan" onclick="toggleUserDetails('${uid}', '${accInfo.bk || ''}', '${accInfo.pk || ''}')">
                ⚡ 관리 도구 & 세이브 열기
              </button>
              <a href="${BYTEBIN_URL}/${accInfo.bk}" target="_blank" class="btn-action btn-emerald" style="text-decoration:none;">
                💾 Bytebin 원본 ↗
              </a>
              <a href="${PASTES_URL}/${accInfo.pk}" target="_blank" class="btn-action btn-emerald" style="text-decoration:none;">
                📋 Pastes 미러 ↗
              </a>
              <button class="btn-action btn-rose" onclick="deleteUserAccount('${uid}')">
                🗑️ 계정 삭제
              </button>
            </div>
          </div>
          <div id="details_${hexId}" style="display:none; margin-top:14px;"></div>

    async function toggleUserDetails(userId, bk, pk) {
      const hexId = userIdToHex(userId);
      const detailContainer = document.getElementById(`details_${hexId}`);
      if (!detailContainer) return;

      if (detailContainer.style.display !== 'none' && detailContainer.dataset.loaded === 'true') {
        detailContainer.style.display = 'none';
        return;
      }

      detailContainer.style.display = 'block';
      detailContainer.innerHTML = '<div style="color:#38bdf8; font-size:0.9rem;">⏳ 유저 상세 데이터를 서버에서 로드하는 중...</div>';

      let saveJson = cachedUserSaves[userId] || null;

      // 1. Try Bytebin
      if (!saveJson && bk) {
        try {
          const res = await fetch(`${BYTEBIN_URL}/${bk}`);
          if (res.ok) saveJson = await res.json();
        } catch (e) {}
      }

      // 2. Try Pastes
      if (!saveJson && pk) {
        try {
          const res = await fetch(`${PASTES_URL}/${pk}`);
          if (res.ok) saveJson = await res.json();
        } catch (e) {}
      }

      // 3. Try Ntfy
      if (!saveJson) {
        try {
          const res = await fetch(`${NTFY_BASE}u_${hexId}/json?poll=1&since=0`);
          if (res.ok) {
            const text = (await res.text()).trim();
            if (text) {
              const lines = text.split('\n');
              for (let i = lines.length - 1; i >= 0; i--) {
                try {
                  const m = JSON.parse(lines[i]);
                  if (m && m.message) {
                    const parsed = JSON.parse(m.message);
                    if (parsed && parsed.d) {
                      saveJson = parsed.d;
                      break;
                    }
                  }
                } catch (e) {}
              }
            }
          }
        } catch (e) {}
      }

      if (!saveJson) {
        detailContainer.innerHTML = '<div style="color:#ef4444; padding:10px;">유저 세이브 데이터를 가져오지 못했습니다. 기기에서 아직 최초 저장이 완료되지 않았을 수 있습니다.</div>';
        return;
      }

      cachedUserSaves[userId] = saveJson;
      detailContainer.dataset.loaded = 'true';
      renderUserDetailView(userId, hexId, saveJson);
    }

    function switchUserTab(hexId, activeTabId, btnEl) {
      const parent = document.getElementById(`details_${hexId}`);

      ['tab_cheats_', 'tab_stats_', 'tab_json_', 'tab_danger_'].forEach(prefix => {
        const el = document.getElementById(prefix + hexId);
        if (el) el.style.display = 'none';
      });

      const activeEl = document.getElementById(activeTabId);
      if (activeEl) activeEl.style.display = 'block';

      const buttons = parent.querySelectorAll('.subtab-btn');
      buttons.forEach(b => b.classList.remove('active'));
      if (btnEl) btnEl.classList.add('active');
    }

    async function saveUserChanges(userId, silent = false) {
      const hexId = userIdToHex(userId);
      let parsedData = cachedUserSaves[userId];

      const jsonEl = document.getElementById(`json_${hexId}`);
      if (jsonEl) {
        try {
          parsedData = JSON.parse(jsonEl.value);
          cachedUserSaves[userId] = parsedData;
        } catch (e) {
          return alert('유효하지 않은 JSON 형식입니다: ' + e.message);
        }
      }

      if (!parsedData) return;

      parsedData.ownerAccountId = userId;
      parsedData.lastSaved = new Date().toISOString();

      try {
        // 1. Upload to Bytebin
        let newBk = null;
        try {
          const bRes = await fetch(`${BYTEBIN_URL}/post`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(parsedData)
          });
          if (bRes.ok) {
            const bJson = await bRes.json();
            if (bJson && bJson.key) newBk = bJson.key;
          }
        } catch (e) {}

        // 2. Upload to Pastes
        let newPk = null;
        try {
          const pRes = await fetch(`${PASTES_URL}/post`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(parsedData)
          });
          if (pRes.ok) {
            const pJson = await pRes.json();
            if (pJson && pJson.key) newPk = pJson.key;
          }
        } catch (e) {}

        // 3. Upload to Ntfy user topic
        await fetch(`${NTFY_BASE}u_${hexId}`, {
          method: 'POST',
          body: JSON.stringify({
            u: userId,
            bk: newBk,
            pk: newPk,
            d: parsedData,
            ts: Date.now()
          })
        });

        // 4. Update registry
        const oldP = (rawAccountsRegistry[userId] && rawAccountsRegistry[userId].p) || '1234';
        rawAccountsRegistry[userId] = {
          p: oldP,
          bk: newBk || (rawAccountsRegistry[userId] && rawAccountsRegistry[userId].bk),
          pk: newPk || (rawAccountsRegistry[userId] && rawAccountsRegistry[userId].pk),
          ts: Date.now()
        };

        await fetch(`${NTFY_BASE}registry`, {
          method: 'POST',
          body: JSON.stringify({
            [userId]: rawAccountsRegistry[userId]
          })
        });

        if (!silent) {
          alert(`✅ [${userId}] 계정의 세이브 데이터가 성공적으로 서버에 업데이트되었습니다!\n유저 기기에서 새로고침 또는 앱 진입 시 실시간으로 반영됩니다.`);
        }
        calculateKpiStats();
      } catch (err) {
        if (!silent) alert('저장 실패: ' + err.message);
      }
    }

    async function changeUserPasswordPrompt(userId) {
      const newPw = prompt(`[${userId}] 계정의 새 비밀번호를 입력하세요:`);
      if (!newPw || !newPw.trim()) return;

      const cleanPw = newPw.trim();
      const current = rawAccountsRegistry[userId] || {};
      current.p = cleanPw;
      current.ts = Date.now();
      rawAccountsRegistry[userId] = current;

      try {
        await fetch(`${NTFY_BASE}registry`, {
          method: 'POST',
          body: JSON.stringify({ [userId]: current })
        });
        alert(`✅ [${userId}] 계정의 비밀번호가 [${cleanPw}]로 변경되었습니다!`);
        filterAccountsList();
      } catch (e) {
        alert('비밀번호 변경 실패: ' + e.message);
      }
    }

          targetHeight: 178,
          growthPoints: 0,
          stats: { str: 14, int: 12, end: 14, gro: 15 },
          activeTitle: "초보 수련자 (173cm)",
          unlockedTitles: ["초보 수련자 (173cm)"],
          equipment: { weapon: null, armor: null, shoes: null, ring: null, aura: null },
          inventory: []
        },
        quests: {
          dailyStreak: 1,
          startDate: new Date().toISOString().slice(0, 10),
          lastActiveDate: new Date().toISOString().slice(0, 10),
          completedToday: {},
          history: {},
          customQuests: []
        },
        raid: {
          unlockedStage: 1,
          clearedStages: [],
          clearCounts: {}
        },
        resetTimestamp: Date.now(),
        lastSaved: new Date().toISOString()
      };

      cachedUserSaves[userId] = resetSave;
      const jsonEl = document.getElementById(`json_${hexId}`);
      if (jsonEl) jsonEl.value = JSON.stringify(resetSave, null, 2);

      await saveUserChanges(userId, true);
      alert(`🔄 [${userId}] 계정이 Lv.1 초기 상태로 리셋되었습니다.`);
      renderUserDetailView(userId, hexId, resetSave);
    }

    async function deleteUserAccount(userId) {
      if (!confirm(`🚨 영구 삭제 경고: [${userId}] 계정을 데이터베이스에서 완전히 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다!`)) return;

      const hexId = userIdToHex(userId);
      try {
        // Mark deleted in registry
        rawAccountsRegistry[userId] = { deleted: true, ts: Date.now() };
        await fetch(`${NTFY_BASE}registry`, {
          method: 'POST',
          body: JSON.stringify({ [userId]: { deleted: true, ts: Date.now() } })
        });

        // Push tombstone to user channel
        await fetch(`${NTFY_BASE}u_${hexId}`, {
          method: 'POST',
          body: JSON.stringify({ u: userId, deleted: true, ts: Date.now() })
        });

        delete cachedUserSaves[userId];
        delete rawAccountsRegistry[userId];

        alert(`🗑️ [${userId}] 계정이 성공적으로 삭제되었습니다.`);
        filterAccountsList();
        calculateKpiStats();
      } catch (e) {
        alert('계정 삭제 실패: ' + e.message);
      }
    }

    function exportAllDatabaseJson() {
      const exportData = {
        exportTime: new Date().toISOString(),
        registry: rawAccountsRegistry,
        saves: cachedUserSaves
      };

      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `hunter_rpg_db_backup_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // Init on load
    window.addEventListener('DOMContentLoaded', checkAdminAuth);
  </script>
</body>
</html>
