<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>성장형 헌터 RPG - 클라우드 데이터베이스 관리자</title>
  <link rel="stylesheet" href="css/style.css?v=20261029_36">
  <style>
    body {
      background: #0a0e17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      padding: 16px;
      margin: 0;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .admin-container {
      max-width: 1100px;
      margin: 0 auto;
      padding-bottom: 80px;
    }
    .admin-header {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(30, 41, 59, 0.95));
      border: 1px solid rgba(0, 229, 255, 0.3);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .admin-header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .admin-header h1 {
      margin: 0;
      color: #00e5ff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .admin-links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }
    .admin-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.35);
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .admin-link-btn:hover {
      background: rgba(0, 229, 255, 0.25);
      border-color: #00e5ff;
      color: #ffffff;
      transform: translateY(-1px);
    }
    .btn-return-game {
      background: linear-gradient(135deg, #10b981, #059669) !important;
      color: #ffffff !important;
      border: 1px solid #34d399 !important;
      font-weight: 800 !important;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
    .btn-return-game:hover {
      background: linear-gradient(135deg, #059669, #047857) !important;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }
    .account-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      transition: all 0.2s;
    }
    .account-card:hover {
      border-color: rgba(0, 229, 255, 0.4);
      box-shadow: 0 6px 20px rgba(0, 229, 255, 0.1);
    }
    .account-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .user-badge {
      font-size: 1.15rem;
      font-weight: 800;
      color: #34d399;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pw-badge {
      font-size: 0.85rem;
      color: #94a3b8;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin: 12px 0;
    }
    .stat-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    .stat-label {
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 4px;
    }
    .stat-val {
      font-size: 1rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    .json-editor {
      width: 100%;
      height: 280px;
      background: #050811;
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 8px;
      color: #38bdf8;
      font-family: Consolas, monospace;
      font-size: 0.85rem;
      padding: 12px;
      box-sizing: border-box;
      resize: vertical;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .btn-action {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .btn-cyan { background: rgba(0, 229, 255, 0.18); border-color: #00e5ff; color: #00e5ff; }
    .btn-cyan:hover { background: #00e5ff; color: #000; }
    .btn-emerald { background: rgba(16, 185, 129, 0.18); border-color: #10b981; color: #34d399; }
    .btn-emerald:hover { background: #10b981; color: #000; }
    .btn-amber { background: rgba(245, 158, 11, 0.18); border-color: #f59e0b; color: #fbbf24; }
    .btn-amber:hover { background: #f59e0b; color: #000; }
    .loading-spinner {
      text-align: center;
      padding: 40px;
      color: #38bdf8;
      font-size: 1.1rem;
    }

    /* Admin Auth Gate Screen */
    .admin-lock-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 8, 18, 0.96);
      backdrop-filter: blur(12px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }
    .admin-lock-box {
      width: 100%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 0 45px rgba(0, 229, 255, 0.25);
    }

    /* Sticky Floating Return Button */
    .floating-back-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 999;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      padding: 12px 22px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 14px;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6), 0 0 16px rgba(16, 185, 129, 0.6);
      border: 2px solid #a7f3d0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .floating-back-btn:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 8px 30px rgba(16, 185, 129, 0.8);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- 🔒 Admin Auth Lock Gate (Shown if not authenticated) -->
  <div id="adminAuthLockScreen" class="admin-lock-screen" style="display: none;">
    <div class="admin-lock-box">
      <div style="font-size: 42px; margin-bottom: 8px;">👑</div>
      <h2 style="color: #00e5ff; margin: 0 0 6px 0; font-size: 1.3rem;">관리자(Admin) 전용 콘솔</h2>
      <p style="color: #94a3b8; font-size: 13px; margin: 0 0 18px 0; line-height: 1.5;">
        관리자 계정으로 인증하세요.<br>
        (아이디: <strong style="color:#38bdf8;">admin</strong> / 비밀번호: <strong style="color:#facc15;">admin1234</strong>)
      </p>

      <div style="margin-bottom: 12px; text-align: left;">
        <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 4px;">관리자 아이디</label>
        <input type="text" id="adminLockId" value="admin" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: #fff; font-size: 15px; box-sizing: border-box;">
      </div>

      <div style="margin-bottom: 14px; text-align: left;">
        <label style="font-size: 12px; color: #cbd5e1; display: block; margin-bottom: 4px;">관리자 비밀번호</label>
        <input type="password" id="adminLockPw" placeholder="admin1234 입력" style="width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: #0f172a; color: #fff; font-size: 15px; box-sizing: border-box;" onkeydown="if(event.key==='Enter') verifyAdminLogin();">
      </div>

      <div id="adminLockFeedback" style="font-size: 12px; min-height: 18px; margin-bottom: 12px; font-weight: 700; color: #f87171;"></div>

      <div style="display: flex; gap: 10px;">
        <button type="button" onclick="verifyAdminLogin()" style="flex: 1; padding: 12px; border-radius: 8px; border: none; background: linear-gradient(135deg, #0284c7, #00e5ff); color: #000; font-weight: 900; font-size: 14px; cursor: pointer;">
          🔑 관리자 패널 열기
        </button>
        <a href="index.html" style="display: inline-flex; align-items: center; justify-content: center; padding: 12px 14px; border-radius: 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #cbd5e1; font-weight: 700; font-size: 13px; text-decoration: none;">
          🎮 메인 게임으로
        </a>
      </div>
    </div>
  </div>

  <!-- 🗄️ Main Admin Panel Content -->
  <div class="admin-container" id="adminMainContent">
    <div class="admin-header">
      <div class="admin-header-top">
        <h1>👑 클라우드 데이터베이스 관리자 콘솔</h1>
        <a href="index.html" class="admin-link-btn btn-return-game">
          🎮 메인 게임으로 돌아가기 ↗
        </a>
      </div>

      <p style="margin: 0; color: #94a3b8; font-size: 0.9rem;">
        성장형 헌터 RPG 유저 계정 실시간 조회, 세이브 데이터 편집 및 클라우드 즉시 동기화
      </p>

      <div class="admin-links">
        <a href="index.html" class="admin-link-btn btn-return-game" style="font-size: 0.9rem;">
          🎮 메인 게임으로 돌아가기
        </a>
        <a href="https://ntfy.sh/okh_gh_cloud_v4_registry" target="_blank" class="admin-link-btn">
          📡 Ntfy 레지스트리 원본 웹 콘솔 ↗
        </a>
        <button class="admin-link-btn" onclick="loadAllAccounts()" style="background: rgba(245, 158, 11, 0.18); border-color: #f59e0b; color: #fbbf24; cursor: pointer;">
          🔄 계정 목록 새로고침
        </button>
        <button class="admin-link-btn" onclick="logoutAdmin()" style="background: rgba(239, 68, 68, 0.15); border-color: #ef4444; color: #f87171; cursor: pointer; margin-left: auto;">
          🚪 관리자 로그아웃
        </button>
      </div>
    </div>

    <!-- Accounts List Container -->
    <div id="accountsList">
      <div class="loading-spinner">📡 서버에서 유저 계정 목록을 불러오는 중...</div>
    </div>
  </div>

  <!-- 🎮 Floating Sticky "메인 게임으로 돌아가기" Button -->
  <a href="index.html" class="floating-back-btn" title="메인 게임 플레이 화면으로 이동">
    🎮 메인 게임으로 돌아가기
  </a>

  <script>
    const NTFY_BASE = 'https://ntfy.sh/okh_gh_cloud_v4_';
    const BYTEBIN_URL = 'https://bytebin.lucko.me';
    const PASTES_URL = 'https://api.pastes.dev';

    function checkAdminAuth() {
      const isAuth = (localStorage.getItem('isAdminLoggedIn') === 'true') ||
                     (sessionStorage.getItem('isAdminLoggedIn') === 'true');

      const lockScreen = document.getElementById('adminAuthLockScreen');
      const mainContent = document.getElementById('adminMainContent');

      if (isAuth) {
        if (lockScreen) lockScreen.style.display = 'none';
        if (mainContent) mainContent.style.display = 'block';
        loadAllAccounts();
      } else {
        if (lockScreen) lockScreen.style.display = 'flex';
        if (mainContent) mainContent.style.display = 'none';
      }
    }

    function verifyAdminLogin() {
      const id = document.getElementById('adminLockId').value.trim();
      const pw = document.getElementById('adminLockPw').value.trim();
      const fb = document.getElementById('adminLockFeedback');

      if (id.toLowerCase() === 'admin' && pw === 'admin1234') {
        localStorage.setItem('isAdminLoggedIn', 'true');
        sessionStorage.setItem('isAdminLoggedIn', 'true');
        document.getElementById('adminAuthLockScreen').style.display = 'none';
        document.getElementById('adminMainContent').style.display = 'block';
        loadAllAccounts();
      } else {
        if (fb) fb.textContent = '❌ 아이디(admin) 또는 비밀번호(admin1234)가 일치하지 않습니다.';
      }
    }

    function logoutAdmin() {
      if (confirm('관리자 세션을 로그아웃하고 메인 게임 화면으로 이동하시겠습니까?')) {
        localStorage.removeItem('isAdminLoggedIn');
        sessionStorage.removeItem('isAdminLoggedIn');
        window.location.href = 'index.html';
      }
    }

    function userIdToHex(userId) {
      const clean = String(userId || '').trim().toLowerCase();
      let hex = '';
      for (let i = 0; i < clean.length; i++) {
        hex += clean.charCodeAt(i).toString(16);
      }
      return hex.slice(0, 32) || 'default';
    }

    async function loadAllAccounts() {
      const listEl = document.getElementById('accountsList');
      listEl.innerHTML = '<div class="loading-spinner">📡 서버에서 유저 계정 목록을 불러오는 중...</div>';

      try {
        const res = await fetch(`${NTFY_BASE}registry/json?poll=1&since=0`);
        if (!res.ok) throw new Error('서버 응답 실패: ' + res.status);

        const text = (await res.text()).trim();
        let registry = {};

        if (text) {
          const lines = text.split('\n');
          for (const line of lines) {
            try {
              const msg = JSON.parse(line);
              if (msg && msg.message) {
                const parsed = JSON.parse(msg.message);
                registry = { ...registry, ...parsed };
              }
            } catch (e) {}
          }
        }

        const userIds = Object.keys(registry);
        if (userIds.length === 0) {
          listEl.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">등록된 유저 계정이 없습니다.</div>';
          return;
        }

        listEl.innerHTML = '';
        for (const uid of userIds) {
          const accInfo = registry[uid] || {};
          const card = document.createElement('div');
          card.className = 'account-card';
          card.id = `card_${userIdToHex(uid)}`;

          const hexId = userIdToHex(uid);
          const syncDateStr = accInfo.ts ? new Date(accInfo.ts).toLocaleString() : '기록 없음';

          card.innerHTML = `
            <div class="account-header">
              <div>
                <span class="user-badge">👤 ${uid}</span>
                <span class="pw-badge">비밀번호: ${accInfo.p || '미설정'}</span>
                <span style="font-size:0.8rem; color:#64748b; margin-left:8px;">최근 동기화: ${syncDateStr}</span>
              </div>
              <div class="btn-group">
                <button class="btn-action btn-cyan" onclick="fetchAndDisplayUserData('${uid}', '${accInfo.bk || ''}', '${accInfo.pk || ''}')">
                  🔍 데이터 조회 / 편집
                </button>
                <a href="${BYTEBIN_URL}/${accInfo.bk}" target="_blank" class="btn-action btn-emerald" style="text-decoration:none;">
                  💾 Bytebin JSON ↗
                </a>
                <a href="${PASTES_URL}/${accInfo.pk}" target="_blank" class="btn-action btn-emerald" style="text-decoration:none;">
                  📋 Pastes JSON ↗
                </a>
                <a href="${NTFY_BASE}u_${hexId}" target="_blank" class="btn-action btn-amber" style="text-decoration:none;">
                  📡 Ntfy 채널 ↗
                </a>
              </div>
            </div>
            <div id="details_${hexId}" style="display:none; margin-top:14px;"></div>
          `;

          listEl.appendChild(card);
        }

      } catch (err) {
        listEl.innerHTML = `<div style="text-align:center; padding:40px; color:#ef4444;">계정 목록 로드 실패: ${err.message}</div>`;
      }
    }

    async function fetchAndDisplayUserData(userId, bk, pk) {
      const hexId = userIdToHex(userId);
      const detailContainer = document.getElementById(`details_${hexId}`);
      if (!detailContainer) return;

      if (detailContainer.style.display !== 'none' && detailContainer.dataset.loaded === 'true') {
        detailContainer.style.display = 'none';
        return;
      }

      detailContainer.style.display = 'block';
      detailContainer.innerHTML = '<div style="color:#38bdf8; font-size:0.9rem;">⏳ 유저 상세 세이브 데이터를 로드하는 중...</div>';

      let saveJson = null;

      // 1. Try Bytebin
      if (bk) {
        try {
          const res = await fetch(`${BYTEBIN_URL}/${bk}`);
          if (res.ok) saveJson = await res.json();
        } catch (e) {}
      }

      // 2. Try Pastes
      if (!saveJson && pk) {
        try {
          const res = await fetch(`${PASTES_URL}/${pk}`);
          if (res.ok) saveJson = await res.json();
        } catch (e) {}
      }

      // 3. Try Ntfy
      if (!saveJson) {
        try {
          const res = await fetch(`${NTFY_BASE}u_${hexId}/json?poll=1&since=0`);
          if (res.ok) {
            const text = (await res.text()).trim();
            if (text) {
              const lines = text.split('\n');
              for (let i = lines.length - 1; i >= 0; i--) {
                try {
                  const m = JSON.parse(lines[i]);
                  if (m && m.message) {
                    const parsed = JSON.parse(m.message);
                    if (parsed && parsed.d) {
                      saveJson = parsed.d;
                      break;
                    }
                  }
                } catch (e) {}
              }
            }
          }
        } catch (e) {}
      }

      if (!saveJson) {
        detailContainer.innerHTML = '<div style="color:#ef4444;">유저 세이브 데이터를 가져오지 못했습니다.</div>';
        return;
      }

      detailContainer.dataset.loaded = 'true';
      const p = saveJson.player || {};
      const s = p.stats || {};
      const r = saveJson.raid || {};
      const q = saveJson.quests || {};

      const goldFmt = typeof p.gold === 'number' ? p.gold.toLocaleString() : (p.gold || 0);

      detailContainer.innerHTML = `
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">레벨 (LV)</div>
            <div class="stat-val" style="color:#38bdf8;">Lv.${p.level || 1}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">골드 (GOLD)</div>
            <div class="stat-val" style="color:#facc15;">${goldFmt} G</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">경험치 (EXP)</div>
            <div class="stat-val" style="color:#a855f7;">${p.exp || 0}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">근력 / 지능 / 체력</div>
            <div class="stat-val">${s.str || 14} / ${s.int || 12} / ${s.end || 14}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">보스 토벌 단계</div>
            <div class="stat-val" style="color:#ef4444;">STAGE ${r.unlockedStage || 1}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">연속 출석일</div>
            <div class="stat-val" style="color:#34d399;">${q.dailyStreak || 1}일</div>
          </div>
        </div>

        <div style="margin-top:14px;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; flex-wrap:wrap; gap:8px;">
            <span style="font-size:0.85rem; font-weight:700; color:#94a3b8;">원시 세이브 JSON 편집기</span>
            <div class="btn-group" style="margin-top:0;">
              <button class="btn-action btn-amber" onclick="addGoldToUser('${userId}', 1000000)">+1,000,000 G 지급</button>
              <button class="btn-action btn-cyan" onclick="saveUserChanges('${userId}')">💾 서버에 변경사항 즉시 저장</button>
            </div>
          </div>
          <textarea class="json-editor" id="json_${hexId}">${JSON.stringify(saveJson, null, 2)}</textarea>
        </div>
      `;
    }

    function addGoldToUser(userId, amount) {
      const hexId = userIdToHex(userId);
      const txt = document.getElementById(`json_${hexId}`);
      if (!txt) return;
      try {
        const obj = JSON.parse(txt.value);
        if (!obj.player) obj.player = {};
        obj.player.gold = (Number(obj.player.gold) || 0) + amount;
        obj.lastSaved = new Date().toISOString();
        txt.value = JSON.stringify(obj, null, 2);
        alert(`골드가 +${amount.toLocaleString()} G 추가되었습니다. [서버에 변경사항 즉시 저장]을 눌러 반영하세요!`);
      } catch (e) {
        alert("JSON 파싱 에러: " + e.message);
      }
    }

    async function saveUserChanges(userId) {
      const hexId = userIdToHex(userId);
      const txt = document.getElementById(`json_${hexId}`);
      if (!txt) return;

      let parsedData;
      try {
        parsedData = JSON.parse(txt.value);
      } catch (e) {
        return alert("유효하지 않은 JSON 형식입니다: " + e.message);
      }

      parsedData.ownerAccountId = userId;
      parsedData.lastSaved = new Date().toISOString();

      try {
        // 1. Upload to Bytebin
        let newBk = null;
        try {
          const bRes = await fetch(`${BYTEBIN_URL}/post`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(parsedData)
          });
          if (bRes.ok) {
            const bJson = await bRes.json();
            if (bJson && bJson.key) newBk = bJson.key;
          }
        } catch (e) {}

        // 2. Upload to Pastes
        let newPk = null;
        try {
          const pRes = await fetch(`${PASTES_URL}/post`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(parsedData)
          });
          if (pRes.ok) {
            const pJson = await pRes.json();
            if (pJson && pJson.key) newPk = pJson.key;
          }
        } catch (e) {}

        // 3. Upload to Ntfy user topic
        await fetch(`${NTFY_BASE}u_${hexId}`, {
          method: 'POST',
          body: JSON.stringify({
            u: userId,
            bk: newBk,
            pk: newPk,
            d: parsedData,
            ts: Date.now()
          })
        });

        // 4. Update registry
        await fetch(`${NTFY_BASE}registry`, {
          method: 'POST',
          body: JSON.stringify({
            [userId]: {
              bk: newBk,
              pk: newPk,
              ts: Date.now()
            }
          })
        });

        alert(`✅ [${userId}] 계정의 세이브 데이터가 성공적으로 서버에 업데이트되었습니다!\n유저 기기에서 새로고침 또는 앱 진입 시 최신 데이터로 자동 반영됩니다.`);
        loadAllAccounts();
      } catch (err) {
        alert("저장 실패: " + err.message);
      }
    }

    // Init on load
    window.addEventListener('DOMContentLoaded', checkAdminAuth);
  </script>
</body>
</html>
